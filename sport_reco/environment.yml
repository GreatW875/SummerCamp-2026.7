  - defaults
dependencies:
  - python=3.10
  # Web 框架 & 实时通信
  - flask>=3.1
  - flask-socketio>=5.6
  - gevent>=26.4
  - gevent-websocket>=0.10.1
  # 数据处理 & 科学计算
  - numpy>=1.26
