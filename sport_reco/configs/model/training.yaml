# 模型训练超参数配置
random_forest:
  n_estimators: 100
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: balanced
  random_state: 42
  n_jobs: -1

svm:
  kernel: rbf
  C: 1.0
  gamma: scale
  class_weight: balanced
  probability: true
  random_state: 42

# 训练数据配置
data:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  # 数据增强
  augmentation:
    enabled: true
    noise_std: 0.01
    scaling_range: [0.95, 1.05]
    time_warp_factor: 0.1
